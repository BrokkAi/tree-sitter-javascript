[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-javascript"
description = "Brokk-maintained Tree-sitter grammar for JavaScript"
version = "0.25.1"
keywords = ["incremental", "parsing", "tree-sitter", "javascript"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [
  { name = "Max Brunsfeld", email = "maxbrunsfeld@gmail.com" },
  { name = "Amaan Qureshi", email = "amaanq12@gmail.com" },
]
requires-python = ">=3.10"
license.text = "MIT"
readme = "README.md"

[project.urls]
Homepage = "https://github.com/BrokkAi/tree-sitter-javascript"
Repository = "https://github.com/BrokkAi/tree-sitter-javascript"
Issues = "https://github.com/BrokkAi/tree-sitter-javascript/issues"

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
